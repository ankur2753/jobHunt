version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: job-hunt-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  job-hunt-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-hunt-agent
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./personal_details:/app/personal_details
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
    depends_on:
      - redis
    command: ["python", "scripts/redis_gateway.py"]
    restart: unless-stopped
